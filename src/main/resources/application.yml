spring:
  application:
    name: bank-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

---
spring:
  config:
    activate:
      on-profile: local
server:
  port: 8080
auth:
  service:
    url: http://localhost:8081
spring.cloud.gateway.routes:
  - id: auth-service
    uri: http://localhost:8081
    predicates:
      - Path=/api/v1/auth/**
  - id: account-service
    uri: http://localhost:8082
    predicates:
      - Path=/api/v1/accounts/**
  - id: transaction-service
    uri: http://localhost:8083
    predicates:
      - Path=/api/v1/transactions/**
  - id: loan-service
    uri: http://localhost:8084
    predicates:
      - Path=/api/v1/loans/**
  - id: notification-service
    uri: http://localhost:8085
    predicates:
      - Path=/api/v1/notifications/**

---
spring:
  config:
    activate:
      on-profile: docker
server:
  port: 8080
auth:
  service:
    url: http://auth-service:8081
spring.cloud.gateway.routes:
  - id: auth-service
    uri: http://auth-service:8081
    predicates:
      - Path=/api/v1/auth/**
  - id: account-service
    uri: http://account-service:8082
    predicates:
      - Path=/api/v1/accounts/**
  - id: transaction-service
    uri: http://transaction-service:8083
    predicates:
      - Path=/api/v1/transactions/**
  - id: loan-service
    uri: http://loan-service:8084
    predicates:
      - Path=/api/v1/loans/**
  - id: notification-service
    uri: http://notification-service:8085
    predicates:
      - Path=/api/v1/notifications/**
